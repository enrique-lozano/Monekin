<store-slide background="light">
  <!-- Every style at the same size, tilted as a diagonal grid that bleeds off
       the edges, so none looks more important than the rest -->
  <div class="phone-grid" style="top: 110px; width: 900px">
    <store-phone shot="01_dashboard"></store-phone>
    <store-phone shot="01_dashboard_dark_purple"></store-phone>
    <store-phone shot="01_dashboard_light_green"></store-phone>
    <store-phone shot="01_dashboard_dark_amoled_orange"></store-phone>
    <store-phone shot="01_dashboard_light_red"></store-phone>
    <store-phone shot="01_dashboard_dark_teal"></store-phone>
  </div>

  <!-- Fades the grid out behind the texts -->
  <div class="fade-bottom" style="height: 460px"></div>

  <header style="top: 1540px">
    <h1><store-text key="title"></store-text></h1>
    <p><store-text key="subtitle"></store-text></p>
  </header>
</store-slide>
