name: Flutter checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get --directory app-marketplaces/play-store

      # build_runner's incremental asset graph, so unchanged files are skipped
      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: build-runner-${{ hashFiles('pubspec.lock') }}-

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # --no-fatal-infos: the codebase currently has ~180 pre-existing
      # info-level issues (mostly deprecated Flutter APIs like
      # withOpacity/WillPopScope). Fixing all of them is a separate effort
      # from "turn CI on", so this still catches errors and warnings (both
      # fatal by default), while leaving that backlog visible in the log
      # without blocking every PR on it. Remove this flag once that backlog
      # is cleared.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
